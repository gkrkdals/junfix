name: Deploy to production

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:   # Actions 탭에서 수동 재배포

# 배포는 겹치면 안 되므로 직렬화 (진행 중인 배포는 취소하지 않음)
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # --- 1) 깨진 코드/마이그레이션이 서버로 나가지 않도록 먼저 검증 ------------
  build-check:
    name: Build & migration check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: ci-root
          MARIADB_DATABASE: junpics_ci
          MARIADB_USER: ci
          MARIADB_PASSWORD: ci-pw
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      NEXT_TELEMETRY_DISABLED: '1'
      DATABASE_URL: 'mysql://ci:ci-pw@127.0.0.1:3306/junpics_ci'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 마이그레이션이 실제 MariaDB 에 적용되는지 확인한다.
      # 여기서 깨지면 서버에서는 migrate 컨테이너가 실패해 배포가 멈춘다.
      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Seed check
        run: npx prisma db seed
        env:
          ADMIN_PASSWORD: ci-only-password

      - name: Build
        run: npm run build

  # --- 2) 소스를 서버로 올리고 서버에서 빌드/배포 ---------------------------
  deploy:
    name: Build & deploy on server
    needs: build-check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
      SSHPASS: ${{ secrets.SSH_PASSWORD }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/junpiks' }}
      REMOTE_TARBALL: /tmp/junpiks-source.tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: sshpass 설치
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      # git 이 추적하는 파일만 담는다 (node_modules / .next / .env 는 제외됨)
      - name: 소스 아카이브 생성
        run: |
          git archive --format=tar.gz -o source.tar.gz HEAD
          echo "크기: $(du -h source.tar.gz | cut -f1)"
          tar tzf source.tar.gz | wc -l | xargs echo "파일 수:"

      - name: 서버로 업로드
        run: |
          sshpass -e scp \
            -o StrictHostKeyChecking=accept-new \
            -P "$SSH_PORT" \
            source.tar.gz "$SSH_USER@$SSH_HOST:$REMOTE_TARBALL"

      # 배포 로직은 scripts/deploy-remote.sh 에 있다. 서버에 미리 둘 필요 없이
      # 매번 stdin 으로 올려 /tmp 에 저장한 뒤 "파일로" 실행한다.
      # (bash -s 로 stdin 에서 직접 실행하면 스크립트 안의 docker compose exec 가
      #  stdin 을 삼켜 스크립트가 중간에 조용히 끝나버린다)
      - name: 서버에서 빌드 및 배포
        run: |
          sshpass -e ssh \
            -o StrictHostKeyChecking=accept-new \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "cat > /tmp/junpiks-deploy.sh && bash /tmp/junpiks-deploy.sh '$DEPLOY_PATH' '$REMOTE_TARBALL'" \
            < scripts/deploy-remote.sh
