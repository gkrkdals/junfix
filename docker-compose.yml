# ---------------------------------------------------------------------------
# junpiks 프로덕션 스택
#   nginx(80) -> next-app(3000) -> mariadb(3306)
#   기동 순서: mariadb(healthy) -> migrate(완료) -> next-app(healthy) -> nginx
# 값은 같은 디렉터리의 .env 에서 주입된다 (.env.example 참고)
# ---------------------------------------------------------------------------

x-database-url: &database-url
  DATABASE_URL: "mysql://${MARIADB_USER:?set MARIADB_USER in .env}:${MARIADB_PASSWORD:?set MARIADB_PASSWORD in .env}@mariadb:3306/${MARIADB_DATABASE:?set MARIADB_DATABASE in .env}"

x-logging: &default-logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: junpiks-nginx
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      # server_name 에 들어갈 목록. 기본은 DOMAIN 하나.
      SERVER_NAMES: ${SERVER_NAMES:-${DOMAIN}}
      # 템플릿에서 치환할 변수를 이 둘로 제한한다.
      # (제한하지 않으면 envsubst 가 다른 환경변수까지 건드릴 수 있다)
      NGINX_ENVSUBST_FILTER: "^(DOMAIN|SERVER_NAMES)$$"
    volumes:
      # templates/*.template -> envsubst -> /etc/nginx/conf.d/*.conf
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      next-app:
        condition: service_healthy
    restart: unless-stopped
    networks: [junpiks]
    logging: *default-logging
    # 갱신된 인증서를 6시간마다 다시 읽는다 (reload 는 무중단).
    # 공식 엔트리포인트는 첫 인자가 nginx 일 때만 templates/ 를 envsubst 하므로,
    # 백그라운드 루프를 띄운 뒤 반드시 엔트리포인트를 통해 nginx 를 실행한다.
    command: >-
      sh -c "while :; do sleep 6h & wait $${!}; nginx -s reload; done &
             exec /docker-entrypoint.sh nginx -g 'daemon off;'"

  # 인증서 자동 갱신. 12시간마다 만료 임박한 인증서를 갱신한다.
  # 최초 발급은 scripts/init-letsencrypt.sh 가 담당한다.
  certbot:
    image: certbot/certbot:latest
    container_name: junpiks-certbot
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: >-
      sh -c "trap exit TERM;
             while :; do
               certbot renew --webroot -w /var/www/certbot --quiet;
               sleep 12h & wait $${!};
             done"
    restart: unless-stopped
    networks: [junpiks]
    logging: *default-logging

  # DB 스키마 적용 + 최초 1회 시딩. 완료 후 종료되는 1회성 컨테이너.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    image: junpiks-migrate:latest
    container_name: junpiks-migrate
    environment:
      <<: *database-url
      # wait-for-db.js 가 TCP 연결을 확인할 대상
      DB_HOST: mariadb
      DB_PORT: "3306"
      ADMIN_USERNAME: ${ADMIN_USERNAME:-junpiks}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
    depends_on:
      mariadb:
        condition: service_healthy
    restart: "no"
    networks: [junpiks]
    logging: *default-logging

  next-app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: junpiks-web:latest
    container_name: junpiks-next-app
    environment:
      <<: *database-url
      NODE_ENV: production
      PORT: "3000"
      # 관리자 세션 쿠키 서명키. 바뀌면 기존 로그인 세션이 모두 무효화된다.
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:?set ADMIN_SESSION_SECRET in .env}
    expose:
      - "3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks: [junpiks]
    logging: *default-logging

  mariadb:
    image: mariadb:11
    container_name: junpiks-mariadb
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?set MARIADB_ROOT_PASSWORD in .env}
      MARIADB_DATABASE: ${MARIADB_DATABASE:?set MARIADB_DATABASE in .env}
      MARIADB_USER: ${MARIADB_USER:?set MARIADB_USER in .env}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?set MARIADB_PASSWORD in .env}
    ports:
      # 기본값은 루프백 바인딩(외부 노출 안 함).
      # 외부에서 직접 접속해야 하면 .env 에 MARIADB_BIND=0.0.0.0 설정.
      - "${MARIADB_BIND:-127.0.0.1}:3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      # healthcheck.sh --connect 는 유닉스 소켓으로 확인하기 때문에,
      # 초기화 중 --skip-networking 으로 뜬 임시 서버도 healthy 로 잡힌다.
      # 그러면 migrate 가 TCP 로 붙다가 P1001 로 죽으므로 TCP 로 확인한다.
      test:
        - CMD-SHELL
        - >-
          healthcheck.sh --connect --innodb_initialized &&
          mariadb-admin ping --protocol=tcp -h 127.0.0.1
          -u root -p"$$MARIADB_ROOT_PASSWORD" --silent
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 40s
    restart: unless-stopped
    networks: [junpiks]
    logging: *default-logging

volumes:
  mariadb_data:
  certbot_conf:
  certbot_www:

networks:
  junpiks:
    driver: bridge
