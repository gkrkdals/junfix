# ---------------------------------------------------------------------------
# junpiks - nginx 리버스 프록시 (정적 서빙 -> Next.js 앱)
# ---------------------------------------------------------------------------

upstream next_upstream {
    server next-app:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    gzip on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml font/woff2;

    # 배포 스크립트 / 모니터링용
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 파일명에 해시가 붙는 빌드 산출물 - 영구 캐시
    location /_next/static/ {
        include /etc/nginx/conf.d/proxy_headers.inc;
        proxy_http_version 1.1;
        proxy_set_header Connection "";     # upstream keepalive 사용
        # Next.js 가 이미 immutable 캐시 헤더를 내려주므로 덮어쓰지 않는다
        proxy_pass http://next_upstream;
    }

    # public/images 정적 자산
    location /images/ {
        include /etc/nginx/conf.d/proxy_headers.inc;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_pass http://next_upstream;
        # upstream 의 max-age=0 을 그대로 두면 매 요청마다 재검증하므로 교체한다
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        include /etc/nginx/conf.d/proxy_headers.inc;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # SSR 스트리밍 응답이 끊기지 않도록
        proxy_buffering off;

        proxy_pass http://next_upstream;
    }
}
